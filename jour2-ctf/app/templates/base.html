<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Boutique du Capitaine</title>
<style>
:root{--bg:#0A0E1A;--card:#141927;--grid:#2A3148;--green:#00FF9C;--cyan:#00D4FF;--pink:#FF3399;--txt:#E8EAF0;--muted:#8892B0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
header{border-bottom:1px solid var(--grid);padding:14px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header .brand{color:var(--green);font-weight:700;font-family:ui-monospace,Consolas,monospace}
header a{color:var(--muted);text-decoration:none;font-size:14px}header a:hover{color:var(--cyan)}
main{max-width:820px;margin:32px auto;padding:0 22px}
h1{font-size:28px}h2{color:var(--cyan)}
.card{background:var(--card);border:1px solid var(--grid);border-left:4px solid var(--pink);border-radius:8px;padding:16px 18px;margin:14px 0}
input,textarea,button{font:inherit;background:#0d1322;color:var(--txt);border:1px solid var(--grid);border-radius:6px;padding:9px 11px}
button{background:var(--green);color:#04121a;font-weight:700;border:none;cursor:pointer}
.msg{color:var(--green);font-family:ui-monospace,Consolas,monospace;font-size:14px;white-space:pre-wrap}
.greet{font-size:20px;margin:14px 0;color:var(--cyan)}
pre{background:#0d1322;border:1px solid var(--grid);border-radius:6px;padding:12px;overflow:auto;color:var(--txt)}
code{font-family:ui-monospace,Consolas,monospace;color:var(--pink)}
label{display:block;margin:8px 0 2px;color:var(--muted);font-size:13px}
footer{color:#5B6680;text-align:center;padding:30px;font-size:12px;font-family:ui-monospace,monospace}
</style></head><body>
<header>
<span class="brand">⚓ La Boutique du Capitaine</span>
<a href="/">Accueil</a><a href="/login">Connexion</a><a href="/search">Recherche</a>
<a href="/greet">Accueil matelot</a><a href="/guestbook">Livre d'or</a>
<a href="/scoreboard">&#127942; Scoreboard</a>
</header><main>{% block content %}{% endblock %}</main>
<footer>Environnement pédagogique DÉLIBÉRÉMENT VULNÉRABLE - IRIS4 Dev · Humanix Cybersecurity</footer>
</body></html>
